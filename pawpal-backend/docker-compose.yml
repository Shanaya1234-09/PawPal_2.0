services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CHATBOT_URL: http://host.docker.internal:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pawpal-data:/data
    restart: unless-stopped

volumes:
  pawpal-data: